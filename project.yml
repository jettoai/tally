name: Tally
options:
  bundleIdPrefix: ai.jetto
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  developmentLanguage: en
  localizations:
    - en
    - zh-Hant
    - zh-Hans
    - ja
    - ko

packages:
  # In-app auto-updates (appcast + EdDSA-signed downloads). Pinned exactly because the generated
  # xcodeproj (and its Package.resolved) is gitignored - a version range would resolve differently
  # per machine. 2.9.4 also fixes the update window opening behind other apps for menu-bar
  # (dockless) apps (sparkle-project/Sparkle#2889).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4

schemes:
  Tally:
    build:
      targets:
        Tally: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
  TallyCLI:
    build:
      targets:
        TallyCLI: all
    run:
      config: Release

targets:
  # `tally` - the account-picking launcher CLI (reads ~/.tally/snapshot.json, execs claude/codex).
  TallyCLI:
    type: tool
    platform: macOS
    sources:
      - TallyCLI
      # `tally add` has to tell a logged-in config home from a free slot, and a Claude Code login
      # now lives in the Keychain rather than in a credentials file. It asks the same probe, under
      # the same derived service name, that the app's discovery does - one implementation, because
      # a drifted second copy of the hash rule would find nothing and read as "not logged in".
      - path: Tally/Core/Keychain/KeychainReader.swift
      - path: Tally/Core/Keychain/ClaudeKeychainService.swift
      # Same reason for the other asymmetric Claude Code path: `tally add` seeds folder trust into
      # a config dir's state file while the app reads that file for the account's plan and email,
      # so both targets compile the one rule for where the default home keeps it (one level up).
      - path: Tally/Core/ClaudeStatePath.swift
      # Adding an account is one act with two surfaces: `tally add` in a terminal and the Settings
      # "Add account" flow in the app. These four files are the act itself - which numbered home
      # is next, what gets symlinked into it from the main account, the folder trust carried over,
      # and the note saying Claude Code's first-run wizard is done - so both targets compile the
      # one implementation. A drifted second copy would put the CLI and the app on different
      # account numbers, or share a set one of them does not. The last one is why the CLI needs it
      # at all: `tally add` sweeps the markers of logins that landed while Tally.app was closed,
      # and the sweep that takes a marker away is the only surface left to leave that note.
      - path: Tally/Core/AddAccount.swift
      - path: Tally/Core/SharedHarness.swift
      # And the question underneath the share: WHICH object a path arrives at, so that a home
      # reached through an alias is that home and a link written any of the ways POSIX allows is
      # still the link we wrote. Both targets compile the one copy because both undo a share -
      # `tally add --no-share` and the Settings row - and a second spelling of "the same place" is
      # precisely how this comparison went wrong four times in three days.
      - path: Tally/Core/PathIdentity.swift
      # And its other half: `tally share` puts an account that ALREADY EXISTS on that same set of
      # links, which the Settings "Shared harness" row does too. One engine for both surfaces, for
      # the reason above - a second copy is how one of them starts backing a file up where the
      # other overwrites it.
      - path: Tally/Core/ShareExisting.swift
      - path: Tally/Core/TrustSeed.swift
      - path: Tally/Core/ClaudeOnboarding.swift
      # Where a torn-down worktree came from: `tally worktree remove` writes the note and the app's
      # token attribution reads it back, so both targets compile the one record. A drifted second
      # spelling would silently stop the app from finding what the CLI wrote, and the symptom (a
      # removed worktree's history pooling into Other) only appears on a later full rescan.
      - path: Tally/Core/WorktreeOrigins.swift
      # The names a launch axis may take. `tally model` validates an effort against the same list
      # the app's picker offers and suggests the same model aliases, so both targets compile the
      # one copy: a drifted second list would let the CLI write an `--effort` value the child does
      # not recognise (a session that will not start) while the app's picker still refused it.
      - path: Tally/Core/LaunchAxisNames.swift
      # The prompt hook to MCP tool contract: the variables the app substitutes into a hook's
      # `input` block and the keys the CLI reads them back under, plus the server and tool names
      # the app registers and the CLI answers to. Both targets compile the one copy because a
      # drifted spelling fails SILENTLY here: Claude Code substitutes an unknown variable with the
      # empty string, which is indistinguishable from a command typed with no arguments.
      - path: Tally/Core/PromptHookInput.swift
      # The native picker's IPC contract: the request the CLI writes under `~/.tally/pick`,
      # the claim and the answer the app writes back, and the row shape the panel draws. Both
      # targets compile the one copy for the reason the two above give, sharpened by the
      # channel: these are separate processes speaking through files, so a drifted field name
      # is a picker that opens and can never be answered.
      - path: Tally/Core/PickContract.swift
      # What signing an account back in actually runs, which the Artifact guard's refusal has to be
      # able to print: a signed-out publishing account cannot be reached with `tally account`, so the
      # way out is a login, and the flag order and the unset-for-the-default-home rule in there are
      # both things this repo has already got wrong once. One copy, compiled by both targets, rather
      # than a command line spelled a second time inside a hook.
      - path: Tally/Core/RenewLoginCommand.swift
      # The Artifact publishing guard's shared vocabulary: the tool the app registers a PreToolUse
      # matcher for, the command it registers, and the environment variable that waives the whole
      # thing. Both targets compile the one copy for the reason above - the app writes these words
      # into somebody's settings.json and this binary answers to them, so a drift is a hook that
      # runs on every Artifact call and abstains, or a guard nobody ever registered.
      - path: Tally/Core/ArtifactHookContract.swift
    settings:
      base:
        PRODUCT_NAME: tally
        PRODUCT_BUNDLE_IDENTIFIER: ai.jetto.tally.cli
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 87Z993GX39
        SWIFT_STRICT_CONCURRENCY: complete

  Tally:
    type: application
    platform: macOS
    sources:
      - Tally
      # The usage advisor's pure math lives in the CLI folder (so the CLI target compiles it too);
      # the app shares the single file rather than duplicating the calculation.
      - path: TallyCLI/UsageAdvisor.swift
      # The reload request file and the live-supervisor registry: the Settings row and `tally
      # reload` must write the same file the same way, so both targets compile the one writer.
      - path: TallyCLI/ReloadRequest.swift
      # The nearly-dry gate in front of every account pick: the panel's smart-pick badge must
      # predict what `tally` launches, so both targets run the one implementation.
      - path: TallyCLI/AccountComfort.swift
      # Same reason, the other exclusion the launcher applies: the badge has to skip accounts the
      # cap quarantine is holding out, so it reads the same records the CLI writes.
      - path: TallyCLI/Quarantine.swift
      # The session status board's record: what each supervised session is doing, published by the
      # supervisor (the only process that can decide it) and read by the panel. Both targets
      # compile the one shape for the reason PickContract.swift gives about its own: these are
      # separate processes speaking through files, so a drifted field name is a board that draws
      # nothing while every session reports correctly. Only the record and its reader are here -
      # everything that DECIDES a state stays in the CLI (SessionStateSync.swift).
      - path: TallyCLI/SessionState.swift
      # The same division one reading over: how many subagents a session has working, written by
      # the hooks Claude Code fires and read by the card that draws the count. Both targets compile
      # the one record for the reason above - separate processes speaking through a file - and the
      # rules for folding an event into a roster come with it, because they are pure arithmetic on
      # a set and the app has to be able to say what the document it just read MEANS.
      - path: TallyCLI/AgentRoster.swift
      # The advisory knock's hook channel, in the same division: the app registers
      # `tally hook-knock <event>` in every Claude account's settings.json and the CLI answers to it,
      # so both targets compile the one spelling of the events, the command and the marker. A
      # drifted second copy fails silently in both directions (QuotaKnockHookContract.swift states
      # them).
      - path: TallyCLI/QuotaKnockHookContract.swift
    dependencies:
      - package: Sparkle
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Tally/Resources/Tally.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: ai.jetto.tally
        MARKETING_VERSION: "0.61.0"
        CURRENT_PROJECT_VERSION: "740"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 87Z993GX39
        PRODUCT_NAME: Tally
        PRODUCT_MODULE_NAME: Tally
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Sparkle wiring. Both values flow into Info.plist via variable substitution; while either
        # is empty (every Debug build, and Release until the EdDSA key is generated at ship time)
        # UpdaterController stays dormant and the Settings row hides - dev builds never poll a feed.
        SPARKLE_FEED_URL: "https://github.com/jettoai/tally/releases/latest/download/appcast.xml"
        SPARKLE_PUBLIC_ED_KEY: ""
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ai.jetto.tally.dev
          PRODUCT_NAME: "Tally Dev"
          SPARKLE_FEED_URL: ""
    info:
      path: Tally/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: "$(SPARKLE_FEED_URL)"
        SUPublicEDKey: "$(SPARKLE_PUBLIC_ED_KEY)"
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 3600
        # Sparkle otherwise ties "may install automatically" to "checks on a schedule", and Tally
        # turns the latter off for good at launch: its scheduler stops permanently at the first
        # release it finds, so Tally watches the feed itself and calls Sparkle when it is time to
        # install (UpdaterController.start). Without this key that switch would be stuck off and
        # the unattended install would never run.
        SUAllowsAutomaticUpdates: true
        CFBundleName: Tally
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        # A background "Renew login" that does not complete falls back to a real Terminal window,
        # opened through osascript. Apple events are a user-granted permission and macOS reads the
        # reason from the RESPONSIBLE app (this one, not the osascript it spawns), so without this
        # key it has nothing to ask with.
        NSAppleEventsUsageDescription: "Tally brings a session's own terminal window to the front when you click it in the session list, and opens a Terminal window to run a provider's own login command when you renew an account's login."
