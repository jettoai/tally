[package]
name = "tally_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# staticlib is what Xcode links; rlib lets `cargo test` exercise the same code.
crate-type = ["staticlib", "rlib"]

[dependencies]
# SIMD substring search. macOS libc memmem is about 24x slower on transcript lines, and that
# search is most of what reading a live line costs.
memchr = "2.8"

[features]
# Test-only: a line equal to `__tally_panic_probe__` panics inside the FFI guard. Never enabled by
# the Xcode build (tests/run-ctxrust-tests.sh builds its own copy with it).
panic-probe = []

[profile.release]
# catch_unwind at the FFI boundary only works with unwinding panics.
panic = "unwind"
# No LTO: with it the archive holds LLVM bitcode from rustc's LLVM, which Apple's linker
# cannot read. Plain machine code links everywhere.
lto = false
codegen-units = 1
debug = "line-tables-only"
