<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source of scripts/dmg/background.tiff, the Tally disk image window's content area (660x400 pt;
     the window frame is 660x432 with the title bar).
     Finder draws the two icons and their labels; this image draws everything else.
     Icon centres (170, 200) and (490, 200) must match scripts/dmg/settings.py.
     The label band (#6F7782, relative luminance about 0.18) sits where Finder draws the labels, so
     black labels (light appearance, 4.6:1) and white labels (dark appearance, 4.5:1) both read.
     The foot line sits at bottom:56px so it stays visible when Finder's path bar (28 pt, a global
     Finder setting) covers the bottom of the window.
     Regenerate: headless Chrome --window-size=660,400 --screenshot at --force-device-scale-factor=1
     (bg.png) and 2 (bg@2x.png), then in that directory:
     tiffutil -cathidpicheck bg.png bg@2x.png -out background.tiff -->
<style>
  html,body{margin:0;padding:0}
  body{width:660px;height:400px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
  .bg{position:relative;width:660px;height:400px;overflow:hidden;background:linear-gradient(180deg,#101317 0%,#1a1f26 46%,#2b333c 100%)}
  .glow{position:absolute;left:50%;top:-120px;width:560px;height:300px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(48,209,88,.20),transparent)}
  h1{position:absolute;margin:0;top:40px;left:0;right:0;text-align:center;font-size:24px;font-weight:650;letter-spacing:-.2px}
  .sub{position:absolute;top:76px;left:0;right:0;text-align:center;font-size:13.5px;color:rgba(255,255,255,.62)}
  .shelf{position:absolute;left:0;right:0;top:254px;height:44px;background:#6F7782}
  .arrow{position:absolute;left:258px;top:174px}
  .foot{position:absolute;bottom:56px;left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.75)}
</style></head>
<body><div class="bg">
  <div class="glow"></div>
  <h1>Drag Tally into Applications</h1>
  <div class="sub">Then open it from your Applications folder.</div>
  <div class="shelf"></div>
  <svg class="arrow" width="144" height="40" viewBox="0 0 144 40"><path d="M6 20h120" stroke="#30d158" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 11"/><path d="M118 8l16 12-16 12" stroke="#30d158" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="foot">Tally runs in the menu bar at the top of your screen.</div>
</div></body></html>
